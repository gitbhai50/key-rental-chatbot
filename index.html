<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Car Rental - Premium AI Assistant</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A2240">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2 family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .urdu-text { font-family: 'Noto Naskh Arabic', serif; line-height: 1.8; }
        :root { --key-navy: #0A2240; --key-yellow: #FFCC00; }
        .bg-key-navy { background-color: var(--key-navy); }
        .bg-key-yellow { background-color: var(--key-yellow); }
        .text-key-yellow { color: var(--key-yellow); }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .robot-float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between overflow-x-hidden antialiased">

    <!-- TOP PREMIUM BAR -->
    <header class="bg-key-navy px-4 py-3.5 flex justify-between items-center border-b-2 border-key-yellow sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="bg-key-yellow text-key-navy font-extrabold px-3 py-1 rounded-lg text-sm tracking-wider shadow-md">KEY</div>
            <div class="flex flex-col">
                <span class="font-bold tracking-widest text-[11px] text-white">CAR RENTAL | المفتاح</span>
                <span class="text-[9px] text-slate-400 font-medium">Official Smart Virtual Assistant</span>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            <span class="text-[10px] text-slate-300 font-semibold">Trained Engine Active</span>
        </div>
    </header>

    <!-- HERO PRESENTATION -->
    <main class="flex-1 p-4 flex flex-col justify-center items-center text-center relative">
        <div class="z-10 max-w-sm bg-slate-900/60 p-6 rounded-3xl border border-slate-800 backdrop-blur-xl shadow-2xl">
            <div class="robot-float mb-6 relative w-32 h-32 mx-auto bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-full flex items-center justify-center border-4 border-slate-800">
                <div class="w-24 h-24 bg-slate-950 rounded-full flex flex-col items-center justify-center border-2 border-cyan-300">
                    <div class="flex space-x-4 mb-1">
                        <div class="w-3 h-3 bg-cyan-300 rounded-full shadow-[0_0_10px_#22d3ee] animate-pulse"></div>
                        <div class="w-3 h-3 bg-cyan-300 rounded-full shadow-[0_0_10px_#22d3ee] animate-pulse"></div>
                    </div>
                    <div class="w-6 h-2 border-b-2 border-cyan-300 rounded-b-full"></div>
                </div>
            </div>
            <h2 class="text-lg font-extrabold text-white">Key Multilingual Agent</h2>
            <p class="text-xs text-slate-400 mt-2">Trained on Terms, Service Cities, Vehicle Categories, and Live Promo Schemes.</p>
        </div>
    </main>

    <!-- FLOATING CHAT WIDGET INTERFACE -->
    <div class="fixed bottom-4 right-4 z-50 flex flex-col items-end">
        
        <!-- Chat Main Window Container -->
        <div id="chat-window" class="hidden w-[94vw] sm:w-[390px] md:w-[415px] h-[80vh] sm:h-[560px] rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden border transition-all duration-300 transform translate-y-4 opacity-0">
            
            <!-- CHAT HEADER WITH LANGUAGE & THEME SELECTOR -->
            <div id="chat-header" class="px-4 py-3 flex flex-col space-y-2 shadow-md relative transition-colors duration-300">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center">
                            <i class="fas fa-car text-white text-sm"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-xs sm:text-sm text-white tracking-tight">Key Virtual Concierge</h4>
                            <span id="chat-status" class="text-[9px] text-slate-200 block opacity-90">Verified Business Engine</span>
                        </div>
                    </div>
                    
                    <button onclick="toggleChat()" class="text-white hover:opacity-80 p-1 bg-white/10 rounded-full w-6 h-6 flex items-center justify-center">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>

                <!-- CONTROLS ROW -->
                <div class="flex items-center justify-between pt-1 border-t border-white/10 gap-2">
                    <select id="lang-selector" onchange="changeBotLanguage(this.value)" class="bg-white/20 text-white text-[10px] font-bold rounded-md px-1.5 py-1 focus:outline-none cursor-pointer border border-white/10 w-[52%]">
                        <option value="en" class="text-slate-900">🇺🇸 English</option>
                        <option value="ur" class="text-slate-900">🇵🇰 اردو</option>
                        <option value="ar" class="text-slate-900">🇸🇦 العربية</option>
                    </select>

                    <select id="theme-selector" onchange="applyTheme(this.value)" class="bg-white/20 text-white text-[10px] font-bold rounded-md px-1.5 py-1 focus:outline-none cursor-pointer border border-white/10 w-[46%]">
                        <option value="classic" class="text-slate-900">👔 Classic Navy</option>
                        <option value="dark" class="text-slate-900">🌙 Pure Dark</option>
                        <option value="gold" class="text-slate-900">✨ Premium Gold</option>
                    </select>
                </div>
            </div>

            <!-- MESSAGES AREA -->
            <div id="chat-body" class="flex-1 p-4 overflow-y-auto space-y-4 text-xs sm:text-sm scroll-smooth transition-colors duration-300">
                <div id="chat-messages" class="space-y-4"></div>
            </div>

            <!-- CHAT INPUT CONTROLS FOOTER -->
            <div id="chat-footer" class="p-3 border-t flex items-center space-x-2.5 transition-colors duration-300">
                <input type="text" id="user-input" placeholder="Reply to Concierge..." class="flex-1 border rounded-xl px-4 py-3 text-xs sm:text-sm focus:outline-none transition-colors font-medium text-slate-900 bg-white" onkeypress="handleKeyPress(event)">
                <button id="send-btn" onclick="sendMessage()" class="w-11 h-11 rounded-xl flex items-center justify-center shadow-md active:scale-95 cursor-pointer flex-shrink-0 transition-colors duration-300">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>

        <!-- FLOATING LAUNCHER BUTTON -->
        <button onclick="toggleChat()" id="chat-button" class="bg-key-navy text-key-yellow hover:scale-105 w-14 h-14 sm:w-16 sm:h-16 rounded-2xl shadow-xl flex flex-col items-center justify-center border-2 border-key-yellow cursor-pointer relative mt-2 group">
            <div class="relative flex items-center justify-center">
                <i class="fas fa-comments text-xl sm:text-2xl" id="toggle-icon"></i>
                <span class="absolute -top-3 -right-3 w-3 h-3 bg-emerald-500 rounded-full border-2 border-key-navy"></span>
            </div>
            <span class="text-[8px] uppercase font-bold tracking-tighter mt-1">Rent Smart</span>
        </button>

    </div>

    <!-- MAIN CONTEXT LOGIC ENGINE -->
    <script>
        const chatWindow = document.getElementById('chat-window');
        const toggleIcon = document.getElementById('toggle-icon');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        
        const chatHeader = document.getElementById('chat-header');
        const chatBody = document.getElementById('chat-body');
        const chatFooter = document.getElementById('chat-footer');
        const sendBtn = document.getElementById('send-btn');

        let isOpen = false;
        let currentLang = 'en'; 

        const themes = {
            classic: { header: 'bg-[#0A2240] border-[#FFCC00]', body: 'bg-slate-50', footer: 'bg-white border-slate-200', btn: 'bg-[#0A2240] text-[#FFCC00]', border: 'border-slate-200', botMsgBg: 'bg-white border-slate-200/80', botTxt: 'text-slate-900' },
            dark: { header: 'bg-[#1E293B] border-slate-700', body: 'bg-[#0F172A]', footer: 'bg-[#1E293B] border-slate-800', btn: 'bg-blue-600 text-white', border: 'border-slate-800', botMsgBg: 'bg-[#1E293B] border-slate-700', botTxt: 'text-slate-100' },
            gold: { header: 'bg-[#1A1A1A] border-[#D4AF37]', body: 'bg-[#F9F6F0]', footer: 'bg-white border-[#E5D3B3]', btn: 'bg-[#1A1A1A] text-[#D4AF37]', border: 'border-[#E5D3B3]', botMsgBg: 'bg-white border-[#E5D3B3]', botTxt: 'text-amber-950' }
        };

        const langData = {
            en: { welcome: "Hello! Welcome to **Key Car Rental Smart Concierge**. I am fully updated with our official Terms, Branches, and Fleet details. How can I guide your journey today? 🚗", placeholder: "Ask about discount, active cities, cancellation rules...", label: "Suggested Actions:", pills: [{text:"🎉 Promo & Deals", act:"Do you have any promo code or seasonal discounts available?"}, {text:"📍 Service Cities", act:"In which cities do you provide your car rental services?"}, {text:"❌ Cancellation Rules", act:"What is your booking cancellation and refund policy?"}] },
            ur: { welcome: "السلام علیکم! المفتاح کار رینٹل اسمارٹ اسسٹنٹ پر خوش آمدید۔ میرے پاس کینسلیشن پالیسی، گاڑیوں کی اقسام اور برانچز کا سارا ڈیٹا اپڈیٹڈ ہے۔ میں آپ کی کیا مدد کروں؟ 🚗", placeholder: "ڈسکاؤنٹ کوڈ، سروس سٹیز، یا کینسلیشن کے بارے میں پوچھیں...", label: "فوری معلومات:", pills: [{text:"🎉 پرومو اور ڈسکاؤنٹ", act:"Do you have any promo code or seasonal discounts available?"}, {text:"📍 فعال شہر", act:"In which cities do you provide your car rental services?"}, {text:"❌ کینسلیشن فیس", act:"What is your booking cancellation and refund policy?"}] },
            ar: { welcome: "مرحباً بك في المفتاح لتأجير السيارات! أنا نظامك الذكي المحدث بالكامل بجميع شروط الإلغاء، الفئات، والمدن النشطة. كيف يمكنني خدمتك اليوم؟ 🚗", placeholder: "اسأل عن الرمز الترويجي، المدن المتاحة، شروط الاسترداد...", label: "خيارات سريعة:", pills: [{text:"🎉 الرمز الترويجي والخصم", act:"Do you have any promo code or seasonal discounts available?"}, {text:"📍 المدن المتاحة", act:"In which cities do you provide your car rental services?"}, {text:"❌ سياسة الإلغاء", act:"What is your booking cancellation and refund policy?"}] }
        };

        function applyTheme(themeKey) {
            const t = themes[themeKey] || themes.classic;
            chatWindow.className = `hidden w-[94vw] sm:w-[390px] md:w-[415px] h-[80vh] sm:h-[560px] rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] flex flex-col overflow-hidden border ${t.border} transition-all duration-300 transform translate-y-4 opacity-0`;
            chatHeader.className = `px-4 py-3 flex flex-col space-y-2 shadow-md relative transition-colors duration-300 ${t.header}`;
            chatBody.className = `flex-1 p-4 overflow-y-auto space-y-4 text-xs sm:text-sm scroll-smooth transition-colors duration-300 ${t.body}`;
            chatFooter.className = `p-3 border-t flex items-center space-x-2.5 transition-colors duration-300 ${t.footer}`;
            sendBtn.className = `w-11 h-11 rounded-xl flex items-center justify-center shadow-md active:scale-95 cursor-pointer flex-shrink-0 transition-colors duration-300 ${t.btn}`;
            changeBotLanguage(currentLang);
        }

        function changeBotLanguage(lang) {
            currentLang = langData[lang] ? lang : 'en';
            chatMessages.innerHTML = ''; 
            if(currentLang === 'ur' || currentLang === 'ar') {
                chatWindow.setAttribute('dir', 'rtl');
                userInput.classList.add('urdu-text');
            } else {
                chatWindow.removeAttribute('dir');
                userInput.classList.remove('urdu-text');
            }
            userInput.placeholder = langData[currentLang].placeholder;
            appendMessage(langData[currentLang].welcome, 'bot');
            appendQuickPills(langData[currentLang].pills);
        }

        function toggleChat() {
            isOpen = !isOpen;
            if(isOpen) {
                chatWindow.classList.remove('hidden');
                setTimeout(() => { chatWindow.classList.remove('translate-y-4', 'opacity-0'); }, 10);
                toggleIcon.className = "fas fa-chevron-down text-xl sm:text-2xl";
            } else {
                chatWindow.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => { chatWindow.classList.add('hidden'); }, 300);
                toggleIcon.className = "fas fa-comments text-xl sm:text-2xl";
            }
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const text = userInput.value.trim();
            if(!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            showTypingIndicator();

            setTimeout(() => {
                removeTypingIndicator();
                let reply = "Thank you for communicating with Key Car Rental Support. For urgent assistance, corporate leasing details, or active modifications, please contact our helpline at 8002440204 or via email at care@key.sa.";
                const lowerText = text.toLowerCase();
                const isArabicOrUrdu = text.match(/[\u0600-\u06FF]/);

                // 1. LIVE SUMMER PROMO ENGINE (Screenshot_20260629_060732_Chrome.png)
                if (lowerText.includes('discount') || lowerText.includes('promo') || lowerText.includes('offer') || lowerText.includes('code') || lowerText.includes('ڈسکاؤنٹ') || lowerText.includes('آفر') || lowerText.includes('خصم') || lowerText.includes('كود')) {
                    if (isArabicOrUrdu) {
                        reply = "🎉 **سمر 2026 ایکسکلوستو ڈسکاؤنٹ آفر لائیو ہے!** (حوالہ: Screenshot_20260629_060732_Chrome.png)<br><br>" +
                                "آپ المفتاح کار رینٹل کی سمر مہم کے تحت گاڑیوں کے کرایے پر **25.00% کا فلیٹ ڈسکاؤنٹ** حاصل کر سکتے ہیں۔<br>" +
                                "• پرومو کوڈ: **SS26**<br>" +
                                "• استعمال کا طریقہ: گاڑی بک کرتے وقت چیک آؤٹ سکرین پر فیلڈ میں یہ کوڈ درج کریں اور ڈسکاؤنٹ فوری حاصل کریں۔ *(شرائط و ضوابط لاگو ہیں)*۔";
                    } else {
                        reply = "🎉 **Summer 2026 Exclusive Promotion is Live!** (Ref: Screenshot_20260629_060732_Chrome.png)<br><br>" +
                                "Get an incredible **25.00% Off** your car rental selection using our ongoing active seasonal campaign.<br>" +
                                "• Promo Code: **SS26**<br>" +
                                "• How to Apply: Simply copy and enter the code **SS26** at the digital checkout screen before completing payment to redeem your 25% price reduction instantly!";
                    }
                }
                // 2. CITIES OPERATIONS (Screenshot_20260629_060938_Chrome.png & Screenshot_20260629_060947_Chrome.png)
                else if (lowerText.includes('city') || lowerText.includes('location') || lowerText.includes('where') || lowerText.includes('شہر') || lowerText.includes('برانچ') || lowerText.includes('مدن') || lowerText.includes('فرع')) {
                    if (isArabicOrUrdu) {
                        reply = "📍 **المفتاح ایکٹو سروس نیٹ ورک:** (حوالہ: Screenshot_20260629_060938_Chrome.png)<br><br>" +
                                "ہم سعودی عرب کے تمام بڑے شہروں اور سرحد پار بحرین میں سروس فراہم کرتے ہیں:<br>" +
                                "• **مغربی اور جنوبی زون:** جدہ، مکہ، مدینہ، طائف، رابغ، ینبع، ابہا، جازان، نجران، تبوک، املج، حائل، قسیم۔<br>" +
                                "• **مرکزی، مشرقی اور فیوچر زون:** ریاض، دمام، جوبیل، الخبر، الاحساء، اور نیوم سٹی (NEOM CITY)۔<br>" +
                                "• **انٹرنیشنل برانچ:** بحرین (Bahrain)۔";
                    } else {
                        reply = "📍 **Key Car Rental - Verified Service Cities:** (Ref: Screenshot_20260629_060938_Chrome.png)<br><br>" +
                                "Our rental network spans seamlessly across all premium locations in KSA and cross-border regions:<br>" +
                                "• **Western / Southern Regions:** Jeddah, Makkah, Madina, Taif, Rabegh, Yanbu, Abha, Jazan, Najran, Tabuk, Umluj, Hail, Qassim.<br>" +
                                "• **Central / Eastern / Future Zones:** Riyadh, Dammam, Jubail, Khobar, Al Hassa, and NEOM City.<br>" +
                                "• **International Connectivity:** Bahrain Branches.";
                    }
                }
                // 3. VEHICLE FLEET CATEGORIES (Screenshot_20260629_061023_Chrome.png)
                else if (lowerText.includes('car') || lowerText.includes('category') || lowerText.includes('fleet') || lowerText.includes('گاڑی') || lowerText.includes('کیٹگری') || lowerText.includes('سيارات')) {
                    if (isArabicOrUrdu) {
                        reply = "🚗 **دستیاب گاڑیوں کے فلیٹ کی اقسام:** (حوالہ: Screenshot_20260629_061023_Chrome.png)<br><br>" +
                                "آپ اپنی ضرورت یا فیملی کے سائز کے مطابق درج ذیل تصدیق شدہ کیٹگریز میں سے گاڑی بک کر سکتے ہیں:<br>" +
                                "• **بجٹ فرینڈلی سمارٹ آپشنز:** Small (چھوٹی گاڑیاں)، Economy (اکنامی)، Medium Sedan، Large Sedan۔<br>" +
                                "• **پریمیم اور ایگزیکٹو فلیٹ:** Luxury (لگژری)، Premier۔<br>" +
                                "• **فیملی اور کاروباری ضروریات:** SUV / Family، Commercial (کمرشل گاڑیاں)۔";
                    } else {
                        reply = "🚗 **Official Fleet Vehicle Categories:** (Ref: Screenshot_20260629_061023_Chrome.png)<br><br>" +
                                "Browse and book vehicles from our diverse categories tailored to your spatial and comfort expectations:<br>" +
                                "• **Budget & Commute:** Small, Economy, Medium Sedan, Large Sedan.<br>" +
                                "• **Executive & Elite Comfort:** Luxury, Premier Cars.<br>" +
                                "• **Family & Business Utility:** SUV / Family, Commercial Fleets.";
                    }
                }
                // 4. CANCELLATION FEES & POLICIES (ARTICLE 15)
                else if (lowerText.includes('cancel') || lowerText.includes('fee') || lowerText.includes('کنسل') || lowerText.includes('منسوخ') || lowerText.includes('الغاء')) {
                    if (isArabicOrUrdu) {
                        reply = "❌ **آفیشل منسوخی (Cancellation) اور کٹوتی قوانین (Article 15):**<br><br>" +
                                "• **25% کٹوتی:** اگر آپ بکنگ کے وقت سے **6 گھنٹے یا اس سے کم** وقت پہلے کینسل کریں گے۔<br>" +
                                "• **ایک دن کا کرایہ کٹوتی (No-Show):** اگر آپ مقررہ تاریخ گزرنے کے بعد منسوخ کریں گے یا گاڑی پک اپ ک
